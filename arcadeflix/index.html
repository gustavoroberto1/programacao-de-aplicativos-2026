<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcadeFlix - Catálogo de Jogos</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <header>
        <h1>🎮 Arcade<span>Flix</span></h1>
        <div>
            <a href="#catalogo">Jogos</a>
            <button id="botaoAbrirModal">Cadastrar</a>
        </div>
    </header>

    <main>
        <section class="banner">
            <div>
                <h2>Encontre seu próximo jogo!</h2>
                <p>Explore nosso catálogo e descubra novas aventuras.</p>
                <a href="#catalogo" class="botao">Ver jogos</a>
            </div>
            <div class="banner-emoji">🕹️</div>
        </section>

        <section class="catalogo" id="catalogo">
            <h2>Catálogo de jogos</h2>
            <div class="filtros">
                <input id="busca" type="search" placeholder="🔍 Pesquisar jogo" />
                <div class="categoria">
                    <button class="ativo" data-categoria="Todos">Todos</button>
                    <button data-categoria="Aventura">Aventura</button>
                    <button data-categoria="Corrida">Corrida</button>
                    <button data-categoria="Estratégia">Estratégia</button>
                </div>
            </div>

            <div id="grade-jogos" class="grade-jogos"></div>
            <p id="mensagem-vazia" class="mensagem-vazia" hidden>Nenhum jogo encontrado</p>
        </section>
    </main>

    <div class="modal" id="modalPost">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nova Jogo</h2>
                <button id="botaoFecharModal">X</button>
            </div>

            <div class="modal-body">
                <label for="imgPost">Nome do Jogo</label>
                <input type="text" id="nome" placeholder="Mine..." />

                <label for="imgPost">Categoria</label>
                <input type="text" id="categoria" placeholder="Aventura..." />

                <label for="imgPost">Descrição</label>
                <input type="text" id="descricao" placeholder="Jogo de aventura..." />

                <label for="imgPost">Emoji</label>
                <input type="text" id="emoji" placeholder="⛏️..." />

                <label for="imgPost">Cor</label>
                <input type="color" id="cor" placeholder="#000..." />

                <button class="botaoPublicar" id="botaoAdicionar">ADICIONAR JOGO</button>
            </div>
        </div>
    </div>
</body>

</html>
