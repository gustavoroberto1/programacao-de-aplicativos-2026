<html>

<head>
    <title>NOSSA PRIMEIRA PÁGINA</title>

    <style>
        body {
            background-color: blue;
        }

        img {
            width: 100px;
            height: 100px;
            margin-top: 32px;
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <h1>PRIMEIRA PÁGINA</h1>

    <input type="text" id="nome" placeholder="Digite seu nome"><br />
    <input type="password" placeholder="Digite sua senha"><br />
    <input type="datetime-local"><br />
    <input type="color" id="cor"/><br />
    <input type="file" /><br />
    <input type="radio"><br />
    <input type="checkbox"><br />

    <select name="" id="">
        <option value="">JAVASCRIPT</option>
        <option value="">HTML</option>
        <option value="">CSS</option>
    </select>
    <br />
    <br />


    <button onclick="clicou()">ENTRAR</button><br />

    <img id="perfil" class="img-perfil" src="https://github.com/gustavoroberto1.png" />

    <script>
        function clicou() {
            var nome = document.getElementById("nome").value;
            alert(nome);
        }

        var seletorCor = document.getElementById("cor");
        seletorCor.addEventListener("input", function () {
            document.body.style.backgroundColor = seletorCor.value;
        })
    </script>
</body>

</html>
